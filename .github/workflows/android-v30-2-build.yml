name: Build Digital Broker v30.3 APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-v30-2-source/**'
      - '.github/workflows/android-v30-2-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='android-v30-2-source/v302-source.tar.xz'
          echo '16bc624b21f63da47be8d722795691f545b9354288b53477388902744658b0c5  android-v30-2-source/v302-source.tar.xz' | sha256sum -c -
          xz -t "$SOURCE"
          tar -tJf "$SOURCE" >/dev/null
          tar -xJf "$SOURCE"

      - name: Verify TLS hardening and version
        shell: bash
        run: |
          set -euo pipefail
          ROOT='digital_broker_android_v30_2/app/src/main/res/raw/russian_trusted_root_ca.pem'
          SUB='digital_broker_android_v30_2/app/src/main/res/raw/russian_trusted_sub_ca.pem'
          NET='digital_broker_android_v30_2/app/src/main/res/xml/network_security_config.xml'
          JAVA='digital_broker_android_v30_2/app/src/main/java/ru/digitalbroker/mobile/MarketDataService.java'
          APP='digital_broker_android_v30_2/app/build.gradle'

          openssl x509 -in "$ROOT" -noout -fingerprint -sha256 | grep -F 'D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31'
          openssl verify -CAfile "$ROOT" "$SUB"
          grep -q '<certificates src="user"' "$NET"
          grep -q '@raw/russian_trusted_root_ca' "$NET"
          grep -q '@raw/russian_trusted_sub_ca' "$NET"
          grep -q 'TRANSPORT_VPN' "$JAVA"
          grep -q 'network.openConnection' "$JAVA"
          grep -q "applicationId 'ru.digitalbroker.mobile.v303'" "$APP"
          grep -q "versionName '30.3.0'" "$APP"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and APK build
        shell: bash
        run: |
          gradle -p digital_broker_android_v30_2 clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='digital_broker_android_v30_2/app/build/outputs/apk/debug/app-debug.apk'
          SOURCE='android-v30-2-source/v302-source.tar.xz'
          test -s "$APK"
          unzip -t "$APK" >/dev/null

          mkdir -p artifact/test-results
          cp "$APK" artifact/DigitalBroker-v30.3.0-installable.apk
          cp "$SOURCE" artifact/DigitalBroker-v30.3.0-android-source.tar.xz
          cp -R digital_broker_android_v30_2/app/build/test-results/testDebugUnitTest/. artifact/test-results/
          cp -R digital_broker_android_v30_2/app/build/reports/tests/testDebugUnitTest artifact/test-report-html

          aapt dump badging "$APK" | tee artifact/APK_BADGING.txt
          grep -q "package: name='ru.digitalbroker.mobile.v303.debug'" artifact/APK_BADGING.txt
          grep -q "versionName='30.3.0-debug'" artifact/APK_BADGING.txt

          apksigner verify --verbose --print-certs "$APK" | tee artifact/APK_SIGNATURE.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' artifact/APK_SIGNATURE.txt

          unzip -l "$APK" > artifact/APK_CONTENTS.txt
          grep -q 'res/raw/russian_trusted_root_ca.pem' artifact/APK_CONTENTS.txt
          grep -q 'res/raw/russian_trusted_sub_ca.pem' artifact/APK_CONTENTS.txt

          (cd artifact && sha256sum DigitalBroker-v30.3.0-installable.apk DigitalBroker-v30.3.0-android-source.tar.xz > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-broker-v30-3-installable-apk
          path: artifact/**
          if-no-files-found: error
          retention-days: 30
