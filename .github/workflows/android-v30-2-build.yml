name: Build Digital Broker v30.2 APK

on:
  push:
    branches: [codex/android-v30-2-recommender]
    paths:
      - 'android-v30-2-source/**'
      - '.github/workflows/android-v30-2-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-v30-2-source/**'
      - '.github/workflows/android-v30-2-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='android-v30-2-source/v302-source.tar.xz'
          test -s "$SOURCE"
          echo '4cb39c7665f0a3df3b89481c0c04bf3a8316c417192eb6979b3bbbd337a96412  android-v30-2-source/v302-source.tar.xz' | sha256sum -c -
          tar -tJf "$SOURCE" >/dev/null
          tar -xJf "$SOURCE"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and APK build
        shell: bash
        run: |
          gradle -p digital_broker_android_v30_2 clean testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Verify APK and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='digital_broker_android_v30_2/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          mkdir -p artifact/test-results
          cp "$APK" artifact/DigitalBroker-v30.2.2-installable.apk
          cp -R digital_broker_android_v30_2/app/build/test-results/testDebugUnitTest/. artifact/test-results/
          cp -R digital_broker_android_v30_2/app/build/reports/tests/testDebugUnitTest artifact/test-report-html
          cp "$SOURCE" artifact/DigitalBroker-v30.2.2-android-source.tar.xz
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > artifact/APK_BADGING.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > artifact/APK_SIGNATURE.txt
          (cd artifact && sha256sum DigitalBroker-v30.2.2-installable.apk DigitalBroker-v30.2.2-android-source.tar.xz > SHA256SUMS.txt)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-broker-v30-2-installable-apk
          path: artifact/**
          if-no-files-found: error
          retention-days: 30
