name: Build Digital Broker v30.3 APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-v30-3-source/**'
      - '.github/workflows/android-v30-3-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat android-v30-3-source/chunk_*.txt > /tmp/v303-source.b64
          base64 --decode /tmp/v303-source.b64 > /tmp/v303-source.tar.xz
          echo 'f52e2bdd4c6e5385f8613cd8e9a9fdeab952fe5b84a8d90b26c849f3104ed14a  /tmp/v303-source.tar.xz' | sha256sum -c -
          xz -t /tmp/v303-source.tar.xz
          tar -tJf /tmp/v303-source.tar.xz >/dev/null
          tar -xJf /tmp/v303-source.tar.xz
          test -d digital_broker_android_v30_3

      - name: Verify bundled certificate chain
        shell: bash
        run: |
          set -euo pipefail
          ROOT='digital_broker_android_v30_3/app/src/main/res/raw/russian_trusted_root_ca.pem'
          SUB='digital_broker_android_v30_3/app/src/main/res/raw/russian_trusted_sub_ca.pem'
          openssl x509 -in "$ROOT" -noout -subject -issuer -fingerprint -sha256
          openssl x509 -in "$SUB" -noout -subject -issuer -fingerprint -sha256
          openssl verify -CAfile "$ROOT" "$SUB"
          grep -q 'moex.com' digital_broker_android_v30_3/app/src/main/res/xml/network_security_config.xml
          grep -q 'cbr.ru' digital_broker_android_v30_3/app/src/main/res/xml/network_security_config.xml
          ! grep -RqiE 'trust.?all|hostnameverifier.*true|usesCleartextTraffic="true"' digital_broker_android_v30_3/app/src/main

      - name: Generate fresh official bootstrap snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile digital_broker_android_v30_3/tools/generate_bootstrap.py
          python3 digital_broker_android_v30_3/tools/generate_bootstrap.py \
            --output digital_broker_android_v30_3/app/src/main/res/raw/bootstrap_snapshot.json \
            --metadata /tmp/bootstrap-metadata.json \
            --root-ca digital_broker_android_v30_3/app/src/main/res/raw/russian_trusted_root_ca.pem \
            --sub-ca digital_broker_android_v30_3/app/src/main/res/raw/russian_trusted_sub_ca.pem
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('/tmp/bootstrap-metadata.json').read_text())
          assert meta['verifiedTls'] is True
          assert all(meta['points'][name] >= 253 for name in ('SBMX','SBGD','LQDT','CBR_GOLD'))
          print(json.dumps(meta, ensure_ascii=False, indent=2))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests and build signed release APK
        shell: bash
        run: |
          gradle -p digital_broker_android_v30_3 clean testReleaseUnitTest assembleRelease --no-daemon --stacktrace

      - name: Verify APK and prepare delivery artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='digital_broker_android_v30_3/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          apksigner verify --verbose --print-certs "$APK" | tee /tmp/APK_SIGNATURE.txt
          aapt dump badging "$APK" | tee /tmp/APK_BADGING.txt
          grep -q "package: name='ru.digitalbroker.mobile' versionCode='30300' versionName='30.3.0'" /tmp/APK_BADGING.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/APK_SIGNATURE.txt
          mkdir -p artifact/test-results
          cp "$APK" artifact/DigitalBroker-v30.3-installable.apk
          cp /tmp/v303-source.tar.xz artifact/DigitalBroker-v30.3-android-source.tar.xz
          cp /tmp/bootstrap-metadata.json artifact/BOOTSTRAP_METADATA.json
          cp /tmp/APK_SIGNATURE.txt artifact/APK_SIGNATURE.txt
          cp /tmp/APK_BADGING.txt artifact/APK_BADGING.txt
          cp -R digital_broker_android_v30_3/app/build/test-results/testReleaseUnitTest/. artifact/test-results/
          cp -R digital_broker_android_v30_3/app/build/reports/tests/testReleaseUnitTest artifact/test-report-html
          cp digital_broker_android_v30_3/README_RU.md artifact/README_RU.md
          (cd artifact && sha256sum DigitalBroker-v30.3-installable.apk DigitalBroker-v30.3-android-source.tar.xz BOOTSTRAP_METADATA.json > SHA256SUMS.txt)

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: digital-broker-v30-3-installable-apk
          path: artifact/**
          if-no-files-found: error
          retention-days: 30
